name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.21'
          cache: false
      - name: Download Go modules
        run: go mod download
      - name: Verify module graph
        run: go mod verify
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...

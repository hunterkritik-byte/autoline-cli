name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Download Go modules
        run: go mod download
      - name: Verify module graph
        run: go mod verify
      - name: Run tests with race detector
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Build CLI
        run: go build -trimpath -ldflags='-s -w' -o /tmp/autoline ./cmd/autoline
      - name: Verify CLI help
        run: /tmp/autoline --help
      - name: Verify doctor JSON
        run: /tmp/autoline doctor --json || test $? -eq 1
